name: On PRs - meson

on: pull_request

concurrency:
  group: ${{github.workflow}}-${{github.head_ref}}
  cancel-in-progress: true

jobs:
  Ubuntu:
    runs-on: ubuntu-20.04
    name: Linux-GCC${{matrix.cxx}}
    strategy:
      matrix:
        cxx: ['7', '10']
    steps:
      - uses: actions/checkout@v3
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: g++-${{matrix.cxx}} ninja-build libgtest-dev
          version: 1.0
      - name: Install meson
        run: python3 -m pip install meson==0.55.0
      - name: Compile and Test
        env:
          CXX: g++-${{matrix.cxx}}
        run: |
          meson setup "${{github.workspace}}/build" -Dauto_features=enabled -Dwarning_level=3 -Dstd_cpp=c++2a
          meson compile -C "${{github.workspace}}/build"
          meson test -C "${{github.workspace}}/build"
  Ubuntu-clang:
    runs-on: ubuntu-20.04
    name: Linux-Clang${{matrix.cxx}}
    strategy:
      matrix:
        cxx: ['7', '12']
    steps:
      - uses: actions/checkout@v3
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: clang-${{matrix.cxx}} libc++abi-${{matrix.cxx}}-dev libc++-${{matrix.cxx}}-dev lld-${{matrix.cxx}} ninja-build
          version: 1.0
      - name: Install meson
        run: python3 -m pip install meson==0.55.0
      - name: Compile and Test
        env:
          CXX: clang++-${{matrix.cxx}}
          CXXFLAGS: -stdlib=libc++
          CXX_LD: lld-${{matrix.cxx}}
        run: |
          meson setup "${{github.workspace}}/build" -Dauto_features=enabled -Dwarning_level=3 -Dstd_cpp=c++2a
          meson compile -C "${{github.workspace}}/build" --verbose
          meson test -C "${{github.workspace}}/build" --verbose
  VisualStudio:
    runs-on: windows-latest
    name: MSVC-${{matrix.platform}}
    strategy:
      matrix:
        platform: ['x64', 'x86']
    steps:
      - uses: actions/checkout@v3

      - name: Install packages
        run: |
          python -m pip install meson ninja

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.platform}}

      - name: Compile and Test
        run: |
          meson setup "${{github.workspace}}/build" -Dwarning_level=3 -Dauto_features=enabled -Dcpp_std=c++latest
          meson compile -C "${{github.workspace}}/build" --verbose
          meson test -C "${{github.workspace}}/build" --verbose
  VisualStudio-cl:
    runs-on: windows-latest
    name: MSVC-clang-cl
    steps:
      - uses: actions/checkout@v3

      - name: Install packages
        run: |
          python -m pip install meson ninja

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.platform}}
      - name: Compile and Test
        env:
          CC: clang-cl
          CXX: clang-cl
        run: |
          meson setup "${{github.workspace}}/build" -Dwarning_level=3 -Dtests=enabled -Dcpp_std=c++latest
          meson compile -C "${{github.workspace}}/build" --verbose
          meson test -C "${{github.workspace}}/build" --verbose
  MSYS2:
    runs-on: windows-latest
    name: MSYS2-${{matrix.platform}}
    strategy:
      matrix:
        platform: ['UCRT64', 'CLANG32', 'CLANG64']
    env:
      MSYS: "winjitdebug"
    steps:
      - uses: actions/checkout@v3

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{matrix.platform}}
          pacboy: >-
            cc:p
            cmake:p
            gtest:p
            meson:p
            ninja:p
            pkgconf:p
            utf8cpp:p

      - name: Compile and Test
        shell: msys2 {0}
        run: |
          meson setup "${{github.workspace}}/build" -Dwarning_level=3 -Dcpp_std=c++20
          meson compile -C "${{github.workspace}}/build" --verbose
          meson test -C "${{github.workspace}}/build" --verbose
  MacOS:
    runs-on: macos-latest
    name: macOS
    steps:
      - uses: actions/checkout@v3

      - name: Install packages
        run: |
          brew install googletest utf8cpp
          python3 -m pip install meson==0.55.0 ninja

      - name: Compile and Test
        run: |
          meson setup "${{github.workspace}}/build" -Dauto_features=enabled -Dwarning_level=3 -Dstd_cpp=c++2a
          meson compile -C "${{github.workspace}}/build"
          meson test -C "${{github.workspace}}/build"
  FreeBSD:
    runs-on: macos-latest
    name: FreeBSD
    steps:
      - uses: actions/checkout@v3
      - name: FreeBSD
        uses: vmactions/freebsd-vm@v0
        with:
          prepare: |
            pkg install -y googletest ninja meson pkgconf utf8cpp
          run: |
            meson setup "${{github.workspace}}/build" -Dwarning_level=3 -Dcpp_std=c++20
            meson compile -C "${{github.workspace}}/build" --verbose
            meson test -C "${{github.workspace}}/build" --verbose
